    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var fetchHolder = originalFetch ? originalFetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return fetchHolder;
            },
            set: function(fn) {
              fetchHolder = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("fetch setter patch error:", e);
        }
      })();
    </script>
